[package]
name = "curl-downloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
